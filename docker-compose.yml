services:
  postgres:
    image: postgres:17
    container_name: equipment-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: equipment_user
      POSTGRES_PASSWORD: equipment_password
      POSTGRES_DB: equipment_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: